[project]
name = "aria-agent"
version = "0.1.0"
description = "ARIA agent: the Python service that runs on the staff PC"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.12",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "websockets>=12.0",
  "sqlcipher3>=0.6.5,<0.7",
  "keyring>=25.0",
  "filelock>=3.0",
  "rapidfuzz>=3.0,<4",
  "httpx>=0.27,<1",
  "icalendar>=6,<7",
  "recurring-ical-events>=3,<4",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "numpy>=1.26,<3",
  "pytest>=8.0",
  "pytest-socket>=0.7",
  "httpx>=0.27",
  "ruff>=0.4",
  "mypy>=1.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent = ["planner/prompts/*.txt"]

[tool.pytest.ini_options]
addopts = "--disable-socket --allow-unix-socket -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
