# Fictional demo calendar. Copy to local-tools.toml for your own installation.
timezone = "Africa/Lagos"
calendar = "../library/sample_calendar.ics"

# Optional offline policy search. Cache stays outside the source folder.
# policy_folder = "../library/policies"
# policy_database = "../data/aria.db"

# Add installed apps explicitly, using their real executable paths:
