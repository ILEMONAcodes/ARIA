[project]
name = "aria-workspace"
version = "0.1.0"
description = "Development workspace for the ARIA desktop agent and cloud gateway"
requires-python = ">=3.11"

[dependency-groups]
dev = ["pre-commit>=4.0", "uv==0.13.7"]

[tool.uv]
package = false
required-version = "==0.13.7"

[tool.uv.workspace]
members = ["services/agent", "services/gateway"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
