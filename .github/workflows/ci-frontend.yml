name: ci-frontend
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('apps/desktop/package.json') != '' }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generate contract types
        run: pnpm gen:types
      - name: Lint and format
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mock agent
        run: pip install -e "../../services/agent[dev]"
      - name: Playwright against the mock agent
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
