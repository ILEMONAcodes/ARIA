name: ci-backend
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Install locked workspace dependencies
        run: uv sync --locked --all-packages --all-extras
      - name: Backend checks (unit tests block network sockets)
        run: uv run --locked --all-packages --all-extras python scripts/check_backend.py
