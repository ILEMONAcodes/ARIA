name: ci-backend
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Install locked workspace dependencies
        run: uv sync --locked --all-packages --all-extras
      - name: Backend checks (unit tests block network sockets)
        run: uv run --locked --all-packages --all-extras python scripts/check_backend.py
      - name: Live localhost mock handoff (separate from network-blocked unit tests)
        run: uv run --locked --all-packages --all-extras python scripts/smoke_mock.py

  store-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Install locked workspace dependencies
        run: uv sync --locked --all-packages --all-extras
      - name: Test agent foundations and gateway flow (network blocked)
        working-directory: services/agent
        run: uv run --locked --all-packages --all-extras python -m pytest tests/unit/test_store.py tests/unit/test_database_keys.py tests/unit/test_bootstrap.py tests/unit/test_fakes.py tests/unit/test_mock_agent.py tests/unit/test_voice_buffers.py tests/unit/test_voice_pipeline.py tests/unit/test_voice_native.py tests/unit/test_voice_server.py tests/unit/test_voice_metrics.py tests/unit/test_gateway_client.py tests/unit/test_cloud_flow.py

  voice-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Install optional locked Windows speech runtime
        run: uv sync --locked --all-packages --all-extras --group voice
      - name: Import native speech packages without models or microphone access
        run: uv run --locked --all-packages --all-extras --group voice python -c "import sounddevice, onnxruntime, faster_whisper, piper; from openwakeword.model import Model"

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9.15.9"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: scripts/contract/pnpm-lock.yaml
      - name: Install locked contract tools
        run: pnpm --dir scripts/contract install --frozen-lockfile
      - name: Check generator, committed types and frontend consumer examples
        run: node scripts/contract/check.mjs
