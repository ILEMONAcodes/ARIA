name: e2e-agent
on:
  schedule:
    - cron: "0 2 * * *"   # nightly
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

jobs:
  e2e:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/agent/pyproject.toml
      - name: Install
        run: |
          pip install -e "services/agent[dev]" -e "services/gateway[dev]"
      - name: Run backend e2e scenarios (fake gateway, fake network)
        run: |
          if [ -d tests/e2e/agent ] && ls tests/e2e/agent/*.py >/dev/null 2>&1; then
            pytest tests/e2e/agent
          else
            echo "No backend e2e tests yet"
          fi
