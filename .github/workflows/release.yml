name: release
on:
  push:
    tags: ["v*"]

jobs:
  windows-installer:
    if: ${{ hashFiles('apps/desktop/package.json') != '' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Build agent sidecar
        run: |
          pip install -e "services/agent" pyinstaller
          # TODO (backend, phase I): build the sidecar and place it where Tauri expects it
      - name: Build and sign installer
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build
      - name: Checksums
        shell: bash
        run: |
          cd apps/desktop/src-tauri/target/release/bundle
          find . -type f \( -name "*.msi" -o -name "*.exe" \) -exec sha256sum {} \; > ../../../../../../checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            checksums.txt
