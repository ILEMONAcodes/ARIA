name: deploy-gateway
on:
  push:
    branches: [main]
    paths: ["services/gateway/**"]
    tags: ["v*"]

env:
  IMAGE: ghcr.io/${{ github.repository }}/gateway

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "services/gateway[dev]"
      - run: cd services/gateway && ruff check . && mypy src && pytest tests/unit

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/gateway
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}

  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy
        run: |
          echo "TODO: deploy ${{ env.IMAGE }}:${{ needs.build.outputs.tag }} to the staging host"
          # Replace with your host's deploy command once the hosting decision is made (docs/DECISIONS.md).
      - name: Health check
        run: |
          test -n "${{ vars.STAGING_URL }}" && curl --fail "${{ vars.STAGING_URL }}/health" || echo "STAGING_URL not set"

  deploy-production:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production   # configure required reviewers on this environment
    steps:
      - name: Deploy
        run: |
          echo "TODO: deploy ${{ env.IMAGE }}:${{ needs.build.outputs.tag }} to production"
      - name: Health check
        run: |
          test -n "${{ vars.PRODUCTION_URL }}" && curl --fail "${{ vars.PRODUCTION_URL }}/health" || echo "PRODUCTION_URL not set"
